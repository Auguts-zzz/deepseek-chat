<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=yes,viewport-fit=cover">
<title>261014 13:13</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#e9eef4;font-family:system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
.app{max-width:100%;width:100%;background:#fff;display:flex;flex-direction:column;height:100vh}
.top-bar{background:#fffdd;backdrop-filter:blur(12px);padding:10px 14px;border-bottom:1px solid #eef2f0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.conv-control{display:flex;align-items:center;gap:6px;background:#f0f2f5;border-radius:40px;padding:4px 10px;flex-wrap:wrap}
.conv-name{font-weight:600;font-size:.85rem;color:#1f5e6e;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:transparent;border:none;font-size:1.1rem;cursor:pointer;padding:4px;border-radius:30px;width:30px;height:30px}
.icon-btn:active{background:#e0e4ea}
.api-section{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.api-input{background:#f0f2f5;border:1px solid #dce3ec;border-radius:40px;padding:5px 10px;font-size:.65rem;width:110px;font-family:monospace}
.small-btn{background:#eef2f7;border:none;border-radius:30px;padding:4px 10px;font-size:.65rem;cursor:pointer}
.select-sm{background:#eef2f7;border:none;border-radius:30px;padding:4px 8px;font-size:.65rem;cursor:pointer;max-width:120px}
.balance-box{background:#fff8e6;border:1px solid #ffe0a3;border-radius:20px;padding:4px 10px;font-size:.65rem;color:#7a5c00;display:flex;align-items:center;gap:6px}
.balance-box span{font-weight:600}
.messages-container{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:#fefefe}
.message{display:flex;flex-direction:column;max-width:85%;position:relative}
.user-message{align-self:flex-end}
.assistant-message{align-self:flex-start}
.bubble{padding:10px 14px;border-radius:22px;line-height:1.45;font-size:.9rem;word-wrap:break-word;white-space:pre-wrap}
.user-message .bubble{background:#1f7e8c;color:#fff;border-bottom-right-radius:6px}
.assistant-message .bubble{background:#eef2fa;border-bottom-left-radius:6px;color:#1a2c3e}
.message-actions{display:flex;gap:10px;margin-top:4px;margin-left:12px;font-size:.6rem;flex-wrap:wrap;align-items:center}
.action-btn{background:transparent;border:none;color:#6c7a91;cursor:pointer;padding:3px 5px;border-radius:20px;display:inline-flex;align-items:center;gap:3px}
.action-btn:active{background:#e2e8f0}
.version-nav{display:inline-flex;align-items:center;gap:4px;background:#f0f2f5;border-radius:20px;padding:1px 6px}
.version-nav button{background:transparent;border:none;cursor:pointer;font-size:.65rem;padding:2px 4px}
.version-label{font-size:.6rem;color:#5f6c80;min-width:30px;text-align:center}
.message-time{font-size:.55rem;color:#8d9aae;margin-top:4px;margin-left:12px}
.loading-bubble{background:#eef2fa;padding:10px 16px;border-radius:24px;display:flex;gap:6px;width:fit-content}
.dot{width:8px;height:8px;background:#8f9bb3;border-radius:50%;animation:wave 1.2s infinite}
@keyframes wave{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.input-area{background:#fff;border-top:1px solid #eef2f0;padding:12px 16px 16px;display:flex;gap:10px;align-items:flex-end}
.input-wrapper{flex:1;background:#f4f7fb;border-radius:32px;padding:8px 16px;border:1px solid #e2e8f0}
textarea{width:100%;border:none;background:transparent;resize:none;font-size:.9rem;font-family:inherit;outline:none;max-height:100px}
.send-btn{background:#1f7e8c;border:none;width:44px;height:44px;border-radius:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:1.2rem}
.send-btn.disabled{opacity:.5;pointer-events:none}
.edit-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:2000}
.edit-modal-content{background:#fff;width:85%;max-width:400px;border-radius:28px;padding:20px}
.edit-modal-content textarea{width:100%;border:1px solid #ccc;border-radius:16px;padding:12px;font-size:.9rem;margin:12px 0;resize:vertical}
.edit-modal-buttons{display:flex;justify-content:flex-end;gap:12px}
.edit-modal-buttons button{padding:8px 16px;border-radius:40px;border:none;background:#eef2f7;font-size:.8rem;cursor:pointer}
.edit-modal-buttons button:first-child{background:#1f7e8c;color:#fff}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);justify-content:center;align-items:center;z-index:1000}
.modal-content{background:#fff;width:85%;max-width:320px;border-radius:28px;padding:20px;max-height:70%;overflow-y:auto}
.modal-header{font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between}
.conv-list,.version-list{list-style:none}
.conv-list li,.version-list li{padding:10px 6px;border-bottom:1px solid #eef2f0;display:flex;justify-content:space-between;align-items:center}
.conv-title,.version-title{cursor:pointer;flex:1;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del-conv{background:none;border:none;font-size:1.1rem;cursor:pointer;color:#c23d3d;padding:0 6px}
.new-conv-btn{background:#1f7e8c;color:#fff;border:none;border-radius:40px;padding:8px;width:100%;margin-top:12px;font-size:.85rem;cursor:pointer}
.footer-note{font-size:.55rem;text-align:center;padding:6px;color:#95a5bc;background:#fffcc}
.color-red{color:#c0392b}.color-blue{color:#2471a3}.color-green{color:#1e8449}.color-purple{color:#7d3c98}.color-orange{color:#b9770e}
@media(max-width:550px){.api-input{width:90px}.conv-name{max-width:100px}}
</style>
</head>
<body>
<div class="app">
<div class="top-bar">
<div class="conv-control">
<button id="showConvListBtn" class="icon-btn">📋</button>
<span id="currentConvName" class="conv-name">对话</span>
<button id="newConvBtn" class="icon-btn">➕</button>
<button id="keepTwoRoundsBtn" class="small-btn" style="background:#ffd966">✂️ 精简2轮</button>
<button id="exportBackupBtn" class="small-btn">💾</button>
<button id="importBackupBtn" class="small-btn">📂</button>
</div>
<div class="api-section">
<select id="providerSelect" class="select-sm">
<option value="openrouter">OpenRouter</option>
<option value="deepseek">DeepSeek官方</option>
<option value="siliconflow">硅基流动</option>
<option value="groq">Groq</option>
<option value="custom">自定义</option>
</select>
<input type="text" id="baseUrlInput" class="api-input" placeholder="Base URL" value="https://openrouter.ai/api/v1">
<input type="password" id="apiKeyInput" class="api-input" placeholder="API Key">
<button id="saveApiBtn" class="small-btn">保存</button>
</div>
</div>
<div class="top-bar" style="padding-top:6px;padding-bottom:6px">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;width:100%">
<input type="text" id="modelSearch" class="api-input" placeholder="搜索模型..." style="width:130px">
<select id="modelSelect" class="select-sm" style="max-width:200px;flex:1"></select>
<div class="balance-box">💰 余额: <span id="balanceDisplay">点击查询</span><button id="queryBalanceBtn" class="small-btn" style="padding:2px 8px">查询</button></div>
</div>
</div>
<div class="messages-container" id="messagesContainer">
<div class="message assistant-message"><div class="bubble" style="color:#1a2c3e">✨ 加载中...</div></div>
</div>
<div class="input-area">
<div class="input-wrapper"><textarea id="userInput" rows="1" placeholder="输入消息... (Enter 发送)"></textarea></div>
<button id="sendButton" class="send-btn">➤</button>
</div>
<div class="footer-note">🔒 数据仅存本地 | 多供应商 | 版本联动 | 余额查询 | 颜色标记</div>
</div>

<div id="editModal" class="edit-modal"><div class="edit-modal-content"><div style="font-weight:600">编辑消息</div><textarea id="editTextarea" rows="4"></textarea><div class="edit-modal-buttons"><button id="editConfirmBtn">确定</button><button id="editCancelBtn">取消</button></div></div></div>
<div id="convModal" class="modal"><div class="modal-content"><div class="modal-header"><span>📁 我的对话</span><button id="closeModalBtn" class="icon-btn">✖️</button></div><ul id="convListUl"></ul><button id="modalNewConvBtn" class="new-conv-btn">➕ 新建对话</button></div></div>
<div id="msgHistoryModal" class="modal"><div class="modal-content"><div class="modal-header"><span>📜 消息历史版本</span><button id="closeHistoryModalBtn" class="icon-btn">✖️</button></div><ul id="historyListUl" class="version-list"></ul></div></div>

<script>
(function(){
const PROVIDERS={
openrouter:{url:"https://openrouter.ai/api/v1",name:"OpenRouter"},
deepseek:{url:"https://api.deepseek.com/v1",name:"DeepSeek官方"},
siliconflow:{url:"https://api.siliconflow.cn/v1",name:"硅基流动"},
groq:{url:"https://api.groq.com/openai/v1",name:"Groq"},
custom:{url:"",name:"自定义"}
};
const SYSTEM_MESSAGE={role:"system",content:"你是DeepSeek助手，扮演角色进行对话，保持一致性，使用中文。可以用颜色标记突出内容：[红]文字[/红]、[蓝]文字[/蓝]、[绿]文字[/绿]、[紫]文字[/紫]、[橙]文字[/橙]。适当使用，不要滥用。"};

let conversations=[],activeConvId=null,currentApiKey="",currentBaseUrl="https://openrouter.ai/api/v1",currentModel="",currentProvider="openrouter",isLoading=false,allModels=[];

const msgContainer=document.getElementById("messagesContainer");
const userInput=document.getElementById("userInput");
const sendBtn=document.getElementById("sendButton");
const apiKeyInput=document.getElementById("apiKeyInput");
const baseUrlInput=document.getElementById("baseUrlInput");
const providerSelect=document.getElementById("providerSelect");
const saveApiBtn=document.getElementById("saveApiBtn");
const modelSelect=document.getElementById("modelSelect");
const modelSearch=document.getElementById("modelSearch");
const balanceDisplay=document.getElementById("balanceDisplay");
const queryBalanceBtn=document.getElementById("queryBalanceBtn");
const convNameSpan=document.getElementById("currentConvName");
const showConvListBtn=document.getElementById("showConvListBtn");
const newConvBtn=document.getElementById("newConvBtn");
const keepTwoRoundsBtn=document.getElementById("keepTwoRoundsBtn");
const exportBackupBtn=document.getElementById("exportBackupBtn");
const importBackupBtn=document.getElementById("importBackupBtn");
const convModal=document.getElementById("convModal");
const msgHistoryModal=document.getElementById("msgHistoryModal");
const convListUl=document.getElementById("convListUl");
const closeModalBtn=document.getElementById("closeModalBtn");
const modalNewConvBtn=document.getElementById("modalNewConvBtn");
const closeHistoryModalBtn=document.getElementById("closeHistoryModalBtn");
const historyListUl=document.getElementById("historyListUl");
const editModal=document.getElementById("editModal");
const editTextarea=document.getElementById("editTextarea");
const editConfirmBtn=document.getElementById("editConfirmBtn");
const editCancelBtn=document.getElementById("editCancelBtn");

function saveAll(){
localStorage.setItem("ds_conversations",JSON.stringify(conversations));
localStorage.setItem("ds_activeConvId",activeConvId);
localStorage.setItem("ds_provider",currentProvider);
localStorage.setItem("ds_baseUrl",currentBaseUrl);
localStorage.setItem("ds_apiKey",currentApiKey);
localStorage.setItem("ds_model",currentModel);
}

function normalizeConv(conv){
if(!conv.messages)conv.messages=[];
conv.messages.forEach(msg=>{
if(!msg.versions)msg.versions=[msg.content];
if(msg.versionIndex===undefined)msg.versionIndex=0;
});
if(!conv.title)conv.title="对话";
return conv;
}

function loadAllData(){
const saved=localStorage.getItem("ds_conversations");
if(saved){try{let p=JSON.parse(saved);if(Array.isArray(p)&&p.length)conversations=p.map(c=>normalizeConv(c));}catch(e){conversations=[];}}
if(!conversations.length){
conversations=[{id:Date.now(),title:"新对话",messages:[{role:"assistant",content:"✨ 欢迎！选择供应商和模型，填写 API Key 后保存。",versions:["✨ 欢迎！选择供应商和模型，填写 API Key 后保存。"],versionIndex:0}]}];
}
currentProvider=localStorage.getItem("ds_provider")||"openrouter";
currentBaseUrl=localStorage.getItem("ds_baseUrl")||PROVIDERS[currentProvider]?.url||"https://openrouter.ai/api/v1";
currentApiKey=localStorage.getItem("ds_apiKey")||"";
currentModel=localStorage.getItem("ds_model")||"";
providerSelect.value=currentProvider;
baseUrlInput.value=currentBaseUrl;
apiKeyInput.value=currentApiKey;
const savedActive=localStorage.getItem("ds_activeConvId");
if(savedActive&&conversations.some(c=>c.id==savedActive))activeConvId=parseInt(savedActive);
else activeConvId=conversations[0].id;
saveAll();
renderMessages();
updateTitle();
}

function getCurrentConv(){return conversations.find(c=>c.id===activeConvId);}
function getCurrentMessages(){const c=getCurrentConv();return c?c.messages:[];}
function saveCurrentMessages(messages){
const conv=getCurrentConv();
if(conv){
conv.messages=messages;
const firstUser=messages.find(m=>m.role==="user");
if(firstUser&&(conv.title==="新对话"||!conv.title))conv.title=firstUser.content.slice(0,20)||"对话";
saveAll();
renderMessages();
updateTitle();
}
}

function escapeHtml(s){return s?s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])):"";}
function renderRichText(text){
let html=escapeHtml(text);
const map={红:'color-red',蓝:'color-blue',绿:'color-green',紫:'color-purple',橙:'color-orange'};
Object.keys(map).forEach(cn=>{
const re=new RegExp(`\\[${cn}\\]([\\s\\S]*?)\\[\\/${cn}\\]`,'g');
html=html.replace(re,`<span class="${map[cn]}">$1</span>`);
});
return html;
}

function renderMessages(){
const messages=getCurrentMessages();
msgContainer.innerHTML="";
if(!messages.length){msgContainer.innerHTML='<div class="message assistant-message"><div class="bubble">开始对话吧～</div></div>';return;}
messages.forEach((msg,idx)=>{
const isUser=msg.role==="user";
const div=document.createElement("div");
div.className=`message ${isUser?"user-message":"assistant-message"}`;
const bubble=document.createElement("div");
bubble.className="bubble";
if(isUser)bubble.innerText=msg.content;
else bubble.innerHTML=renderRichText(msg.content);
div.appendChild(bubble);
const actions=document.createElement("div");
actions.className="message-actions";
const copyBtn=document.createElement("button");
copyBtn.className="action-btn";
copyBtn.innerHTML="📋 复制";
copyBtn.onclick=async e=>{e.stopPropagation();await navigator.clipboard.writeText(msg.content);copyBtn.innerHTML="✅";setTimeout(()=>copyBtn.innerHTML="📋 复制",1000);};
actions.appendChild(copyBtn);
if(msg.versions&&msg.versions.length>1){
const nav=document.createElement("span");
nav.className="version-nav";
const prev=document.createElement("button");prev.textContent="◀";
prev.onclick=e=>{e.stopPropagation();switchMessageVersion(idx,msg.versionIndex-1);};
const label=document.createElement("span");label.className="version-label";label.textContent=`${msg.versionIndex+1}/${msg.versions.length}`;
const next=document.createElement("button");next.textContent="▶";
next.onclick=e=>{e.stopPropagation();switchMessageVersion(idx,msg.versionIndex+1);};
nav.appendChild(prev);nav.appendChild(label);nav.appendChild(next);
actions.appendChild(nav);
}
const historyBtn=document.createElement("button");
historyBtn.className="action-btn";historyBtn.innerHTML="📜 历史";
historyBtn.onclick=e=>{e.stopPropagation();showMessageHistory(idx,msg.content,msg.versions||[]);};
actions.appendChild(historyBtn);
if(isUser){
const editBtn=document.createElement("button");
editBtn.className="action-btn";editBtn.innerHTML="✏️ 编辑";
editBtn.onclick=e=>{e.stopPropagation();showEditModal(idx,msg.content);};
actions.appendChild(editBtn);
}
if(!isUser){
const lastAssistantIdx=messages.reduce((last,m,i)=>m.role==="assistant"?i:last,-1);
if(idx===lastAssistantIdx){
const regen=document.createElement("button");
regen.className="action-btn";regen.innerHTML="🔄 重新生成";
regen.onclick=e=>{e.stopPropagation();regenerateLastAssistant();};
actions.appendChild(regen);
}
}
div.appendChild(actions);
const time=document.createElement("div");time.className="message-time";
time.innerText=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
div.appendChild(time);
msgContainer.appendChild(div);
});
msgContainer.scrollTop=msgContainer.scrollHeight;
}

function switchMessageVersion(idx,newIndex){
const conv=getCurrentConv();if(!conv)return;
const msgs=conv.messages;const msg=msgs[idx];
if(!msg||!msg.versions)return;
if(newIndex<0||newIndex>=msg.versions.length)return;
msg.versionIndex=newIndex;
msg.content=msg.versions[newIndex];
if(msg.role==="user"){
for(let i=idx+1;i<msgs.length;i++){
if(msgs[i].role==="assistant"){
const ai=msgs[i];
if(ai.versions&&ai.versions.length>0){
const t=Math.min(newIndex,ai.versions.length-1);
ai.versionIndex=t;ai.content=ai.versions[t];
}
break;
}
}
}
saveAll();renderMessages();
}

function updateTitle(){const c=getCurrentConv();convNameSpan.innerText=c?c.title:"对话";}
function showLoading(){let ld=document.getElementById("loadingMsg");if(!ld){ld=document.createElement("div");ld.className="message assistant-message";ld.id="loadingMsg";ld.innerHTML='<div class="loading-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';msgContainer.appendChild(ld);msgContainer.scrollTop=msgContainer.scrollHeight;}}
function hideLoading(){document.getElementById("loadingMsg")?.remove();}

async function callAPI(messages){
if(!currentApiKey)throw new Error("请先保存 API Key");
if(!currentModel)throw new Error("请选择模型");
const controller=new AbortController();
const tid=setTimeout(()=>controller.abort(),180000);
try{
const headers={"Content-Type":"application/json","Authorization":`Bearer ${currentApiKey}`};
if(currentProvider==="openrouter"){headers["HTTP-Referer"]=location.origin;headers["X-Title"]="Roleplay Chat";}
const res=await fetch(`${currentBaseUrl}/chat/completions`,{method:"POST",headers,body:JSON.stringify({model:currentModel,messages,temperature:.7,max_tokens:2000,stream:false}),signal:controller.signal});
clearTimeout(tid);
if(!res.ok){let err=`HTTP ${res.status}`;try{const j=await res.json();err=j.error?.message||j.message||err;}catch(e){}throw new Error(err);}
const data=await res.json();
if(!data.choices?.[0]?.message?.content)throw new Error("回复为空");
return data.choices[0].message.content;
}catch(err){clearTimeout(tid);throw err;}
}

async function sendMessage(text){
if(isLoading){alert("请等待上一条回复完成");return;}
const conv=getCurrentConv();if(!conv)return;
const oldMsgs=getCurrentMessages();
const newUser={role:"user",content:text,versions:[text],versionIndex:0};
const updated=[...oldMsgs,newUser];
saveCurrentMessages(updated);
isLoading=true;sendBtn.classList.add("disabled");showLoading();
try{
const apiMsgs=updated.map(m=>({role:m.role,content:m.content}));
const reply=await callAPI(apiMsgs);
hideLoading();
const newAI={role:"assistant",content:reply,versions:[reply],versionIndex:0};
saveCurrentMessages([...updated,newAI]);
}catch(err){
hideLoading();
const errMsg=err.message||"调用失败";
const errObj={role:"assistant",content:`⚠️ 错误：${errMsg}`,versions:[`⚠️ 错误：${errMsg}`],versionIndex:0};
saveCurrentMessages([...updated,errObj]);
}finally{isLoading=false;sendBtn.classList.remove("disabled");}
}

function showEditModal(idx,originalContent){editTextarea.value=originalContent;editModal.style.display="flex";window._pendingEditIdx=idx;}
function closeEditModal(){editModal.style.display="none";window._pendingEditIdx=null;}

async function confirmEdit(){
const newContent=editTextarea.value.trim();
if(newContent===""){closeEditModal();return;}
const idx=window._pendingEditIdx;closeEditModal();
const msgs=getCurrentMessages();
if(idx===null||idx>=msgs.length)return;
const msg=msgs[idx];
if(!msg.versions)msg.versions=[msg.content];
msg.versions.push(newContent);
msg.versionIndex=msg.versions.length-1;
msg.content=newContent;
const newMsgs=msgs.slice(0,idx+1);
saveCurrentMessages(newMsgs);
await regenerateAfterEdit(newMsgs);
}

async function regenerateAfterEdit(msgsWithoutAI){
if(isLoading)return;
isLoading=true;sendBtn.classList.add("disabled");showLoading();
try{
const apiMsgs=msgsWithoutAI.map(m=>({role:m.role,content:m.content}));
const reply=await callAPI(apiMsgs);
hideLoading();
const newAI={role:"assistant",content:reply,versions:[reply],versionIndex:0};
saveCurrentMessages([...msgsWithoutAI,newAI]);
}catch(err){
hideLoading();
const errMsg=err.message||"调用失败";
const errObj={role:"assistant",content:`⚠️ 错误：${errMsg}`,versions:[`⚠️ 错误：${errMsg}`],versionIndex:0};
saveCurrentMessages([...msgsWithoutAI,errObj]);
}finally{isLoading=false;sendBtn.classList.remove("disabled");}
}

async function regenerateLastAssistant(){
if(isLoading)return;
const msgs=getCurrentMessages();
let lastAI=-1;
for(let i=msgs.length-1;i>=0;i--){if(msgs[i].role==="assistant"){lastAI=i;break;}}
if(lastAI===-1){alert("没有可重新生成的消息");return;}
const assistantMsg=msgs[lastAI];
if(!assistantMsg.versions)assistantMsg.versions=[assistantMsg.content];
// 直接把当前内容作为历史版本保留在 versions 中（已存在），然后基于截断的消息重新生成
const truncated=msgs.slice(0,lastAI);
saveCurrentMessages(truncated);
await regenerateAfterEdit(truncated);
}

function showMessageHistory(idx,currentContent,versions){
historyListUl.innerHTML="";
const all=versions.length?versions:[currentContent];
all.forEach((ver,i)=>{
const li=document.createElement("li");
const span=document.createElement("span");
span.className="version-title";
const isCur=(i===versions.length-1);
span.innerText=`版本 ${i+1}${isCur?" (当前)":""}`;
span.onclick=()=>{
const msgs=getCurrentMessages();
if(idx<msgs.length){
const msg=msgs[idx];
if(!msg.versions)msg.versions=[msg.content];
msg.versionIndex=i;msg.content=msg.versions[i];
if(msg.role==="user"){
for(let j=idx+1;j<msgs.length;j++){
if(msgs[j].role==="assistant"){
const ai=msgs[j];
if(ai.versions&&ai.versions.length>0){
const t=Math.min(i,ai.versions.length-1);
ai.versionIndex=t;ai.content=ai.versions[t];
}
break;
}
}
}
saveAll();renderMessages();
msgHistoryModal.style.display="none";
}
};
li.appendChild(span);historyListUl.appendChild(li);
});
msgHistoryModal.style.display="flex";
}

function keepLastTwoRounds(){
if(isLoading){alert("请等待当前回复完成");return;}
const conv=getCurrentConv();if(!conv)return;
let msgs=conv.messages;
if(!msgs.length){alert("没有消息可精简");return;}
const sys=msgs.filter(m=>m.role==="system");
const nonSys=msgs.filter(m=>m.role!=="system");
const kept=nonSys.slice(-4);
const newMsgs=[...sys,...kept].map(m=>({role:m.role,content:m.content,versions:[m.content],versionIndex:0}));
conv.messages=newMsgs;
conv.title=(conv.title||"对话")+" (精简2轮)";
saveAll();renderMessages();updateTitle();
alert(`已保留最近2轮（共${kept.length}条消息）。`);
}

async function loadModelsForProvider(provider,baseUrl){
let models=[];
const url=baseUrl?`${baseUrl}/models`:"";
if(!url){modelSelect.innerHTML='<option value="">请填写 Base URL</option>';return;}
try{
const headers={};
if(currentApiKey)headers["Authorization"]=`Bearer ${currentApiKey}`;
const res=await fetch(url,{headers});
if(res.ok){
const data=await res.json();
if(data.data&&Array.isArray(data.data))models=data.data.map(m=>m.id).filter(Boolean);
else if(Array.isArray(data))models=data.map(m=>m.id||m.name).filter(Boolean);
}
}catch(e){console.warn("拉取模型失败",e);}
if(!models.length){
if(provider==="openrouter")models=["deepseek/deepseek-v3.2","deepseek/deepseek-v4-flash","deepseek/deepseek-v4-pro","openai/gpt-4o","anthropic/claude-3.5-sonnet"];
else if(provider==="deepseek")models=["deepseek-chat","deepseek-reasoner"];
else if(provider==="siliconflow")models=["deepseek-ai/DeepSeek-V3","deepseek-ai/DeepSeek-R1"];
else if(provider==="groq")models=["llama-3.3-70b-versatile","mixtral-8x7b-32768"];
else models=["gpt-3.5-turbo"];
}
allModels=models.sort();
applyModelFilter();
}

function applyModelFilter(){
const kw=modelSearch.value.trim().toLowerCase();
const filtered=kw?allModels.filter(m=>m.toLowerCase().includes(kw)):allModels;
modelSelect.innerHTML="";
if(!filtered.length){
const opt=document.createElement("option");opt.value="";opt.textContent="无匹配模型";modelSelect.appendChild(opt);return;
}
filtered.forEach(m=>{
const opt=document.createElement("option");opt.value=m;opt.textContent=m;
if(m===currentModel)opt.selected=true;
modelSelect.appendChild(opt);
});
if(!currentModel&&filtered.length){currentModel=filtered[0];modelSelect.value=currentModel;}
}

function onProviderChange(){
const p=providerSelect.value;currentProvider=p;
if(p!=="custom"&&PROVIDERS[p]){currentBaseUrl=PROVIDERS[p].url;baseUrlInput.value=currentBaseUrl;}
localStorage.setItem("ds_provider",p);localStorage.setItem("ds_baseUrl",currentBaseUrl);
loadModelsForProvider(p,currentBaseUrl);
}

async function queryBalance(){
const p=currentProvider;
const key=currentApiKey;
if(!key){balanceDisplay.innerText="请先保存 API Key";return;}
balanceDisplay.innerText="查询中...";
try{
let url="",headers={};
if(p==="deepseek"){url="https://api.deepseek.com/user/balance";headers={"Authorization":`Bearer ${key}`};}
else if(p==="openrouter"){url="https://openrouter.ai/api/v1/credits";headers={"Authorization":`Bearer ${key}`};}
else if(p==="siliconflow"){url="https://api.siliconflow.cn/v1/user/info";headers={"Authorization":`Bearer ${key}`};}
else{balanceDisplay.innerText="无法查询余额";return;}
const res=await fetch(url,{headers});
if(!res.ok){balanceDisplay.innerText=`查询失败 (HTTP ${res.status})`;return;}
const data=await res.json();
if(p==="deepseek"){
const b=data.balance_infos?.[0];
balanceDisplay.innerText=b?`${b.total_balance} ${b.currency}`:"未知";
}else if(p==="openrouter"){
balanceDisplay.innerText=data.data?`$${data.data.total_credits}`:"未知";
}else if(p==="siliconflow"){
balanceDisplay.innerText=data.data?`¥${data.data.balance}`:"未知";
}
}catch(e){balanceDisplay.innerText="查询失败";}
}

// 其他：对话管理、备份、事件绑定
function switchConversation(id){
if(isLoading){alert("请等待完成");return;}
activeConvId=id;saveAll();updateTitle();renderMessages();closeModalPanel();
}
function newConversation(){
if(isLoading)return;
const id=Date.now();
conversations.push({id,title:"新对话",messages:[]});
activeConvId=id;saveAll();updateTitle();renderMessages();closeModalPanel();
}
function deleteConversation(id){
if(conversations.length===1){alert("至少保留一个对话");return;}
const idx=conversations.findIndex(c=>c.id===id);
if(idx!==-1){
conversations.splice(idx,1);
if(activeConvId===id)activeConvId=conversations[0].id;
saveAll();updateTitle();renderMessages();closeModalPanel();
}
}
function refreshConvList(){
convListUl.innerHTML="";
conversations.forEach(c=>{
const li=document.createElement("li");
const span=document.createElement("span");span.className="conv-title";span.innerText=c.title||"对话";
span.onclick=()=>switchConversation(c.id);
const del=document.createElement("button");del.className="del-conv";del.innerText="🗑️";
del.onclick=e=>{e.stopPropagation();if(confirm("删除对话？"))deleteConversation(c.id);};
li.appendChild(span);li.appendChild(del);convListUl.appendChild(li);
});
}
function openModalPanel(){refreshConvList();convModal.style.display="flex";}
function closeModalPanel(){convModal.style.display="none";}
function closeHistoryModalPanel(){msgHistoryModal.style.display="none";}

function exportBackup(){
const blob=new Blob([JSON.stringify(conversations,null,2)],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`roleplay_backup_${Date.now()}.json`;a.click();URL.revokeObjectURL(a.href);
alert("备份已导出");
}
function importBackup(){
const input=document.createElement("input");input.type="file";input.accept="application/json";
input.onchange=e=>{
const file=e.target.files[0];if(!file)return;
const reader=new FileReader();
reader.onload=ev=>{
try{
const imported=JSON.parse(ev.target.result);
if(Array.isArray(imported)&&imported.length){
conversations=imported.map(c=>normalizeConv(c));
saveAll();
if(!activeConvId||!conversations.some(c=>c.id===activeConvId))activeConvId=conversations[0].id;
renderMessages();updateTitle();alert("导入成功");
}else alert("格式错误");
}catch(err){alert("解析失败");}
};
reader.readAsText(file);
};
input.click();
}

function bindEvents(){
sendBtn.onclick=()=>{const text=userInput.value.trim();if(text&&!isLoading){userInput.value="";userInput.style.height="auto";sendMessage(text);}};
userInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const text=userInput.value.trim();if(text&&!isLoading){userInput.value="";userInput.style.height="auto";sendMessage(text);}}});
userInput.addEventListener("input",()=>{userInput.style.height='auto';userInput.style.height=Math.min(100,userInput.scrollHeight)+'px';});
providerSelect.onchange=onProviderChange;
baseUrlInput.oninput=()=>{currentBaseUrl=baseUrlInput.value.trim();};
apiKeyInput.oninput=()=>{currentApiKey=apiKeyInput.value.trim();};
saveApiBtn.onclick=()=>{currentBaseUrl=baseUrlInput.value.trim();currentApiKey=apiKeyInput.value.trim();currentModel=modelSelect.value;saveAll();alert("✅ 设置已保存");};
modelSearch.oninput=applyModelFilter;
modelSelect.onchange=()=>{currentModel=modelSelect.value;saveAll();};
queryBalanceBtn.onclick=queryBalance;
showConvListBtn.onclick=openModalPanel;
closeModalBtn.onclick=closeModalPanel;
newConvBtn.onclick=newConversation;
modalNewConvBtn.onclick=()=>{newConversation();closeModalPanel();};
keepTwoRoundsBtn.onclick=()=>{if(confirm("将保留最近2轮并清除历史版本，确定？"))keepLastTwoRounds();};
exportBackupBtn.onclick=exportBackup;
importBackupBtn.onclick=importBackup;
closeHistoryModalBtn.onclick=closeHistoryModalPanel;
editConfirmBtn.onclick=confirmEdit;
editCancelBtn.onclick=closeEditModal;
window.addEventListener("click",e=>{
if(e.target===convModal)closeModalPanel();
if(e.target===msgHistoryModal)closeHistoryModalPanel();
if(e.target===editModal)closeEditModal();
});
}

async function bootstrap(){
loadAllData();
bindEvents();
await loadModelsForProvider(currentProvider,currentBaseUrl);
if(currentModel&&allModels.includes(currentModel))modelSelect.value=currentModel;
else if(allModels.length){currentModel=allModels[0];modelSelect.value=currentModel;}
renderMessages();updateTitle();
}
bootstrap();
})();
</script>
